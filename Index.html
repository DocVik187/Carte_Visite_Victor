<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victor CARVALHO - Carte de Visite</title>
    <!-- Tailwind CSS pour le style -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f3f0; /* Ton naturel, beige clair/pierre */
            color: #2c2925; /* Gris foncé chaleureux */
            -webkit-font-smoothing: antialiased;
        }

        /* Couleur d'accentuation Dalkia (Orange) */
        .dalkia-accent {
            background-color: #f26122;
        }
        .dalkia-accent:hover {
            background-color: #d9561e;
        }
        .dalkia-text {
            color: #f26122;
        }

        /* Animation d'apparition douce */
        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
    <body class="min-h-screen flex items-center justify-center p-4">

    <!-- Conteneur principal (Mobile-first) -->
    <div class="bg-white w-full max-w-sm rounded-[2rem] shadow-xl overflow-hidden fade-in relative">
        
        <!-- En-tête / Image de fond (Anthracite pour contraster avec l'orange) -->
        <div class="h-32 bg-[#2c2925] relative"></div>

        <!-- Section Profil -->
        <div class="px-6 pb-8 relative -mt-16 text-center">
            
            <!-- Photo de profil -->
            <div class="inline-block relative">
                <img src="Photo ID VCA.jpg" alt="Photo de profil" 
                 class="w-32 h-32 rounded-full border-4 border-white shadow-md object-cover">
            </div>

            <!-- Infos principales -->
            <div class="mt-4">
                <h1 class="text-2xl font-semibold tracking-tight text-gray-800">Victor CARVALHO</h1>
                <p class="text-gray-500 font-medium mt-1">Expert Systèmes Thermodynamiques</p>
                <p class="text-sm text-gray-400 mt-2">Spécialiste en efficacité énergétique et solutions thermodynamiques.</p>
            </div>

            <!-- Bouton "Enregistrer le contact" (vCard) -->
            <button onclick="downloadVCard()" 
                    class="mt-6 w-full dalkia-accent text-white font-medium py-3.5 px-4 rounded-xl shadow-lg transition duration-300 flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i>
                Enregistrer le contact
            </button>

            <!-- Actions Rapides (Grille) -->
            <div class="grid grid-cols-3 gap-3 mt-6">
                <!-- Téléphone -->
                <a href="tel:+33760802356" class="flex flex-col items-center justify-center bg-gray-50 rounded-xl p-3 hover:bg-gray-100 transition">
                    <div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-700 mb-2">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Appeler</span>
                </a>
                
                <!-- Email -->
                <a href="mailto:victor.carvalho@dalkia.fr" class="flex flex-col items-center justify-center bg-gray-50 rounded-xl p-3 hover:bg-gray-100 transition">
                    <div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-700 mb-2">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Email</span>
                </a>

                <!-- Site Web (Dalkia) -->
                <a href="https://www.dalkia.fr" target="_blank" class="flex flex-col items-center justify-center bg-gray-50 rounded-xl p-3 hover:bg-gray-100 transition">
                    <div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-700 mb-2">
                        <i class="fa-solid fa-globe"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Site Web</span>
                </a>
            </div>

            <!-- Séparateur -->
            <hr class="my-6 border-gray-100">

            <!-- Réseaux Sociaux -->
            <div class="flex justify-center">
                <a href="https://www.linkedin.com/in/victor-carvalho-76140874/" target="_blank" class="w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center text-gray-500 hover:text-[#0077b5] hover:border-[#0077b5] hover:bg-blue-50 transition">
                    <i class="fa-brands fa-linkedin-in text-lg"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- Script pour la génération du vCard -->
    <script>
        function downloadVCard() {
            // Informations du contact à modifier selon vos besoins
            const contact = {
                firstName: "Victor",
                lastName: "CARVALHO",
                title: "Expert Système Thermodynamique",
                phone: "+33760802356",
                email: "victorcarvalho@dalkia.fr",
                website: "https://www.linkedin.com/in/victor-carvalho-76140874/",
                company: "Dalkia Corporate"
            };

            // Construction de la chaîne au format vCard 3.0
            const vcard = `BEGIN:VCARD
VERSION:3.0
N:${contact.lastName};${contact.firstName};;;
FN:${contact.firstName} ${contact.lastName}
ORG:${contact.company}
TITLE:${contact.title}
TEL;TYPE=WORK,VOICE:${contact.phone}
EMAIL;TYPE=PREF,INTERNET:${contact.email}
URL:${contact.website}
END:VCARD`;

            // Création d'un Blob (fichier virtuel) avec le contenu vCard
            const blob = new Blob([vcard], { type: 'text/vcard' });
            
            // Création d'une URL pour le Blob
            const url = window.URL.createObjectURL(blob);
            
            // Création d'un élément de lien <a> temporaire pour déclencher le téléchargement
            const a = document.createElement('a');
            a.href = url;
            a.download = `${contact.firstName}_${contact.lastName}.vcf`;
            
            // Ajout au DOM, clic, puis nettoyage
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            // Libération de la mémoire
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
