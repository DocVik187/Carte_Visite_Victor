<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victor CARVALHO - Carte de Visite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f5f3f0; color: #2c2925; -webkit-font-smoothing: antialiased; }
        .dalkia-accent { background-color: #f26122; }
        .dalkia-accent:hover { background-color: #d9561e; }
        .dalkia-text { color: #f26122; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-[2rem] shadow-xl overflow-hidden relative">
        <div class="h-32 bg-[#f26122] relative"></div>
        <div class="px-6 pb-8 relative -mt-16 text-center">
            <div class="inline-block relative">
                <img src="https://placehold.co/400x500/cccccc/ffffff?text=Photo" alt="Photo de profil" class="w-32 h-40 rounded-xl border-4 border-white shadow-md object-cover bg-white">
            </div>
            <div class="mt-4">
                <h1 class="text-2xl font-semibold tracking-tight text-gray-800">Victor CARVALHO</h1>
                <p class="text-gray-500 font-medium mt-1">Expert Systèmes Thermodynamiques</p>
                <p class="text-sm text-gray-400 mt-2">Spécialiste en efficacité énergétique et solutions thermodynamiques.</p>
            </div>
            <button class="mt-6 w-full dalkia-accent text-white font-medium py-3.5 px-4 rounded-xl shadow-lg transition duration-300 flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i>
                Enregistrer le contact
            </button>
            <div class="grid grid-cols-3 gap-3 mt-6">
                <div class="flex flex-col items-center justify-center bg-gray-50 rounded-xl p-3"><div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-700 mb-2"><i class="fa-solid fa-phone"></i></div><span class="text-xs font-medium text-gray-600">Appeler</span></div>
                <div class="flex flex-col items-center justify-center bg-gray-50 rounded-xl p-3"><div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-700 mb-2"><i class="fa-solid fa-envelope"></i></div><span class="text-xs font-medium text-gray-600">Email</span></div>
                <div class="flex flex-col items-center justify-center bg-gray-50 rounded-xl p-3"><div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-700 mb-2"><i class="fa-solid fa-globe"></i></div><span class="text-xs font-medium text-gray-600">Site Web</span></div>
            </div>
            <hr class="my-6 border-gray-100">
            <div class="flex justify-center">
                <div class="w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center text-gray-500"><i class="fa-brands fa-linkedin-in text-lg"></i></div>
            </div>
        </div>
    </div>
</body>
</html>
